# =========================================================
# Main Branch Security Pipeline
# =========================================================
#
# Purpose:
# Deep security checks after code reaches main branch.
#
# This workflow is intentionally heavier and slower.
#
# Goal:
# Protect the main branch and production quality.
#
# =========================================================

name: Main Security Pipeline

# ---------------------------------------------------------
# Run only when code reaches main branch
# ---------------------------------------------------------
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"

# ---------------------------------------------------------
# Don't cancel security scans mid-run
# ---------------------------------------------------------
concurrency:
  group: main-security-${{ github.sha }}
  cancel-in-progress: false
# ---------------------------------------------------------

jobs:
  security:
    name: Security Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # kills hung jobs

    permissions:
      contents: read
      security-events: write # required for Scorecard SARIF upload

    steps:
      # ---------------------------------------------------
      # Clone repository
      # ---------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # required for gitleaks

      # ---------------------------------------------------
      # Install pnpm
      # ---------------------------------------------------
      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11

      # ---------------------------------------------------
      # Setup Node.js
      # ---------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22 # LTS
          cache: pnpm

      # ---------------------------------------------------
      # Install dependencies
      # ---------------------------------------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---------------------------------------------------
      # Secrets scanning - catches leaked tokens/keys
      # ---------------------------------------------------
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ---------------------------------------------------
      # Moderate vulns visible but non-blocking
      # ---------------------------------------------------
      - name: Run dependency audit (moderate, warn only)
        run: pnpm audit --audit-level=moderate
        continue-on-error: true
      # ---------------------------------------------------
      # Blocks on high/critical severity vulns
      - name: Run dependency audit (high, blocking)
        run: pnpm audit --audit-level=high
        continue-on-error: false
      # ---------------------------------------------------
      # Prod-only audit reported separately
      # ---------------------------------------------------
      - name: Run prod-only dependency audit
        run: pnpm audit --prod --audit-level=high
        continue-on-error: false
      # ---------------------------------------------------
      # License compliance check
      # ---------------------------------------------------
      - name: Check dependency licenses
        run: pnpm license list --prod
        continue-on-error: true # TODO: Adjust to false when set an allowed-list
      # ---------------------------------------------------
      # Run npm dependency audit
      #
      # Fails on high severity vulnerabilities.
      # ---------------------------------------------------
      - name: Run dependency audit
        run: pnpm audit --audit-level=high

      # ---------------------------------------------------
      # Static code security analysis
      #
      # Detects:
      # - insecure patterns
      # - dangerous code
      # - possible vulnerabilities
      # ---------------------------------------------------
      - name: Run Snyk code analysis (SAST)
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
      # ---------------------------------------------------
      # Scan dependencies with Snyk
      # ---------------------------------------------------
      - name: Run Snyk dependency scan
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --all-projects --severity-threshold=high --fail-on=upgradable
      # ---------------------------------------------------
      # OpenSSF Scorecard - run only on the weekly cron to avoid noise
      # ---------------------------------------------------
      - name: Run OpenSSF Scorecard
        if: ${{ github.event_name == 'schedule' }}
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_format: sarif
          results_file: scorecard.sarif
          publish_results: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ---------------------------------------------------
      # Upload SARIF report
      # ---------------------------------------------------
      - name: Upload Scorecard SARIF result
        if: github.event_name == 'schedule'
        uses: github/codeql-action/upload-sarif@bc0b696b4103f5fe60f15749af68a046868d511a # v2.25.4
        with:
          sarif_file: scorecard.sarif
