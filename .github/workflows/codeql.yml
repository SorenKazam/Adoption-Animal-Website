# =========================================================
# CodeQL Security Analysis
# =========================================================
#
# Purpose:
# Advanced semantic security analysis using GitHub CodeQL.
#
# Detects:
# - injection vulnerabilities
# - insecure data flows
# - dangerous API usage
# - authentication/security issues
#
# =========================================================

name: CodeQL Analysis

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 5 * * 1"

# ---------------------------------------------------------
# Cancel older PR scans if newer commits are pushed
# ---------------------------------------------------------
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript

    steps:
      # ---------------------------------------------------
      # Checkout repository
      # ---------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # ---------------------------------------------------
      # Initialize CodeQL
      # ---------------------------------------------------
      - name: Initialize CodeQL
        uses: github/codeql-action/init@bc0b696b4103f5fe60f15749af68a046868d511a # v2.25.4
        with:
          languages: ${{ matrix.language }}

      # ---------------------------------------------------
      # Install pnpm
      # ---------------------------------------------------
      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11

      # ---------------------------------------------------
      # Setup Node.js
      # ---------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      # ---------------------------------------------------
      # Install dependencies
      # ---------------------------------------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---------------------------------------------------
      # Build application
      #
      # Required for accurate CodeQL analysis.
      # ---------------------------------------------------
      - name: Build application
        run: pnpm build
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      # ---------------------------------------------------
      # Perform CodeQL analysis
      # ---------------------------------------------------
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@bc0b696b4103f5fe60f15749af68a046868d511a # v2.25.4
        with:
          upload: false # do not upload SARIF results to GitHub, free plan limit
