# =========================================================
# Pull Request Quality Gate
# =========================================================
#
# Purpose:
# Fast checks before code enters main branch.
#
# This workflow focuses on:
# - Code quality
# - Type safety
# - Build validation
# - Unit tests
#
# Goal:
# Catch problems EARLY and provide fast feedback.
#
# =========================================================

name: PR Quality Gate

# ---------------------------------------------------------
# Trigger workflow on pull requests targeting main
# ---------------------------------------------------------
on:
  pull_request:
    branches:
      - main

# ---------------------------------------------------------
# Cancel older runs if a new commit is pushed to the PR
#
# Example:
# Developer pushes 5 commits quickly.
# We only care about the newest run.
# ---------------------------------------------------------
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks

    # -----------------------------------------------------
    # Operating system used by GitHub runner
    # -----------------------------------------------------
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # kills hung jobs

    # -----------------------------------------------------
    # Security permissions
    #
    # contents: read
    # Allows repository checkout only.
    # Minimal permissions = better security.
    # -----------------------------------------------------
    permissions:
      contents: read

    # -----------------------------------------------------
    steps:
      # ---------------------------------------------------
      # Clone repository
      # ---------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        # Future note: To get the hash version to any thing that needs it:
        # 1) Go to https://github.com/actions/checkout
        # 2) Click on the version you want (in "releases")
        # 3) The URL should look like this: https://github.com/actions/checkout/commit/de0fac2e4500dabe0009e67214ff5f5447ce83dd
        # 4) Copy the hash (last part of the URL)

      # ---------------------------------------------------
      # Install pnpm package manager
      # ---------------------------------------------------
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11

      # ---------------------------------------------------
      # Setup Node.js + dependency cache
      #
      # Cache makes future runs MUCH faster.
      # ---------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22 # LTS
          cache: pnpm

      # ---------------------------------------------------
      # Restore Next.js build cache
      # ---------------------------------------------------
      - name: Restore Next.js build cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      # ---------------------------------------------------
      # Install project dependencies
      #
      # --frozen-lockfile guarantees reproducible installs.
      # Prevents lockfile drift.
      # ---------------------------------------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---------------------------------------------------
      # Run ESLint
      #
      # Detects:
      # - bad patterns
      # - possible bugs
      # - style issues
      # ---------------------------------------------------
      - name: Run linter
        run: pnpm lint
      # ---------------------------------------------------
      # Run automated tests
      # ---------------------------------------------------
      - name: Run tests
        run: pnpm test
        env:
          CI: true
      # ---------------------------------------------------
      # Verify production build
      #
      # Ensures app can compile successfully.
      # ---------------------------------------------------
      - name: Run production build
        run: pnpm build
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      # ---------------------------------------------------
      # Upload build artifacts on failure
      # ---------------------------------------------------
      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-failure-${{ github.run_id }}
          path: |
            .next/
            *.log
          retention-days: 3 # Retain build artifacts for 3 days
